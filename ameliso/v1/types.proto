syntax = "proto3";

package ameliso.v1;

option go_package = "github.com/tupe12334/ameliso/generated;ameliso";

message Case {
  string path = 1;
  string title = 2;
  string description = 3;
  repeated string tags = 4;
  string priority = 5;
  string created_at = 6;
  string updated_at = 7;
  // Markdown body — the actual test procedure/steps. Populated when the caller
  // needs full case content (e.g. ListCases, GetCase, GetPendingCases).
  string body = 8;
  // IDs of testing strategies linked to this case.
  repeated string strategy_ids = 9;
  // When true, this case can be executed and validated by an AI agent.
  bool ai_runnable = 10;
  // Case slugs that must pass before this case is run. Used to model test
  // ordering constraints (e.g. checkout requires login). Empty = no prerequisites.
  repeated string prerequisites = 11;
  // Server-formatted relative timestamps (e.g. "2h ago", "3 days ago", "Apr 25, 2026").
  string formatted_created_at = 12;
  string formatted_updated_at = 13;
  // Lifecycle status: "draft" = work-in-progress (excluded from runs by default),
  // "published" = approved (default for existing cases). Empty string treated as
  // "published" for backwards compatibility.
  string status = 14;
  SyncStatus sync_status = 15;
  string last_sync_error = 16;
}

message TestingStrategy {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  string created_at = 5;
  string updated_at = 6;
  string deleted_at = 7;
  string execution_hints = 8;
}

message RunTemplate {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated string suite_ids = 4;
  string default_strategy_id = 5;
  repeated string tags = 6;
  string created_at = 7;
  string updated_at = 8;
}

message RepoPermission {
  string name = 1;
  string role = 2;
}

message RepoToken {
  string token = 1;
  string name = 2;
  string role = 3;
  string created_at = 4;
  string expires_at = 5;  // ISO-8601 UTC, empty = never expires
}

message Suite {
  string slug = 1;
  string name = 2;
  string description = 3;
  repeated string cases = 4;
  // Default testing strategy applied when starting a run from this suite.
  string default_strategy_id = 5;
  SyncStatus sync_status = 6;
  string last_sync_error = 7;
}

message RunMeta {
  string id = 1;
  string date = 2;
  repeated string testers = 3;
  RunStatus status = 4;
  string environment = 5;
  string suite = 6;
  // Optional git commit SHA recorded at run creation time.
  // Agents can use this as `since_ref` in GetAffectedCases to find
  // tests affected since this run's baseline commit.
  string commit_sha = 7;
  // Result counts — populated by ListRuns and FinalizeRun so agents can
  // read pass/fail outcomes without a separate GetRun call.
  int32 passed = 8;
  int32 failed = 9;
  int32 blocked = 10;
  int32 skipped = 11;
  int32 total = 12;
  string description = 13;
  // Server-formatted relative timestamp (e.g. "2h ago", "3 days ago", "Apr 25, 2026").
  string formatted_date = 14;
  // User UUID of the agent or user who claimed this run; empty when unclaimed.
  string assignee_id = 15;
  // ID of the testing strategy used for this run. Empty when not set.
  string strategy_id = 16;
  // GitHub pull request number associated with this run. 0 when not set.
  int32 pr_number = 17;
  SyncStatus sync_status = 18;
  string last_sync_error = 19;
}

message CaseResult {
  string case_path = 1;
  ResultStatus status = 2;
  string notes = 3;
  // Snapshot of case body (markdown) at time of result recording.
  string body_snapshot = 4;
  // Execution time in milliseconds. 0 means not recorded.
  int64 duration_ms = 5;
  // Free-form failure category (e.g. "assertion", "timeout", "crash"). Empty when not set.
  string error_type = 6;
  // ID of the testing strategy used to execute this case. Empty when not recorded.
  string strategy_id = 7;
  // Identity of the user who recorded this result (Auth0 user UUID or empty).
  string recorded_by = 8;
}

message Run {
  RunMeta meta = 1;
  repeated CaseResult results = 2;
}

message CoverageEntry {
  Case case = 1;
  ResultStatus latest_status = 2;
  string last_run_id = 3;
  string last_run_date = 4;
  // Deprecated: use case.body instead (Case.body is now always populated).
  string body = 5;
  // 0.0 = never flaky, 1.0 = status changes every run. Only set when ≥2 results exist.
  float flakiness_score = 6;
  // Average execution time in milliseconds across all recorded results. 0 means not recorded.
  int64 duration_ms = 7;
  // Error category from the latest result (e.g. "assertion", "timeout", "crash"). Empty when not set.
  string error_type = 8;
}

message AffectedCase {
  Case case = 1;
  string reason = 2;
  // Latest test result status for this case — lets agents prioritize
  // never-run or failed cases over recently-passed ones.
  ResultStatus latest_status = 3;
  // Deprecated: use case.body instead (Case.body is now always populated).
  string body = 4;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_IN_PROGRESS = 1;
  RUN_STATUS_COMPLETED = 2;
  RUN_STATUS_ABORTED = 3;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_PASSED = 1;
  RESULT_STATUS_FAILED = 2;
  RESULT_STATUS_BLOCKED = 3;
  RESULT_STATUS_SKIPPED = 4;
  RESULT_STATUS_NEVER = 5;
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
}

enum SyncStatus {
  SYNC_STATUS_UNSPECIFIED = 0;
  SYNC_STATUS_UNSYNCED = 1;
  SYNC_STATUS_SYNCING = 2;
  SYNC_STATUS_SYNCED = 3;
  SYNC_STATUS_FAILED = 4;
}

message AuditEntry {
  int64 id = 1;
  string action = 2;        // "create" | "delete" | "restore"
  string resource_type = 3; // "case", "run", "suite", "strategy"
  string resource_id = 4;   // case_path, run_id, or slug
  string created_at = 5;    // ISO-8601 timestamp
  // Server-formatted relative timestamp (e.g. "2h ago", "3 days ago", "Apr 25, 2026").
  string formatted_created_at = 6;
  // Auth0-resolved user UUID (string form). Empty when the request was made
  // with an opaque API key or no JWT was presented.
  string user_id = 7;
  // x-request-id header value (or server-generated UUID) — correlates this
  // audit row with the originating gRPC request and downstream traces.
  string request_id = 8;
  // "success" or "error". Empty for legacy rows recorded before the
  // outcome column was introduced.
  string outcome = 9;
  // Short machine-readable code (e.g. "invalid_argument", "permission_denied")
  // when outcome == "error". Empty otherwise.
  string error_code = 10;
  // Client IP address as captured by the server interceptor. Empty when the
  // transport did not expose one (e.g. unix socket).
  string ip = 11;
  // User-Agent header value as sent by the client. Empty when not provided.
  string user_agent = 12;
  // Free-form JSON payload captured at audit time (jsonb in DB). Encoded as a
  // compact JSON string. Empty when the row had no payload.
  string payload_json = 13;
}

// A GitHub repository connected via the GitHub App installation.
message Repository {
  string id = 1;              // "owner/repo"
  string name = 2;            // "repo"
  string full_name = 3;       // "owner/repo"
  string html_url = 4;        // "https://github.com/owner/repo"
  reserved 5, 7;
  reserved "local_path", "cloned";
  string installation_id = 6;
  string added_at = 8;
  string api_key = 9;
  // Storage backend (#162). One of "github", "testmo".
  string adapter_kind = 10;
  // ISO-8601 timestamp of the last successful SyncRepository, or empty.
  string last_synced_at = 11;
  // ISO-8601 timestamp of the last *failed* background mirror push, or empty.
  string last_failure_at = 12;
  // Human-readable reason for the last failure, or empty when healthy.
  string last_failure_reason = 13;
}

message SuiteCoverageSummary {
  string slug = 1;
  int32 total_cases = 2;
  int32 covered_cases = 3;
  int32 coverage_pct = 4;
}

message FlakyCaseSummary {
  string case_path = 1;
  int32 flip_count = 2;
  string last_flip_sha = 3;
}

message CaseGitCommit {
  string sha = 1;
  string author = 2;
  string date = 3;
  string message = 4;
}

message RunTrendMetric {
  string date = 1;
  int32 passed = 2;
  int32 failed = 3;
  int32 blocked = 4;
  int32 skipped = 5;
  int32 total = 6;
  string suite = 7;
}

message OutboundWebhook {
  string id = 1;
  string repo_id = 2;
  string url = 3;
  string secret = 4;
  repeated string event_types = 5;
  string created_at = 6;
  string updated_at = 7;
}

message OutboundWebhookDelivery {
  string id = 1;
  string repo_id = 2;
  string webhook_id = 3;
  string event = 4;
  int32 status_code = 5;
  string outcome = 6;
  string delivered_at = 7;
  string payload = 8;
}

message RunTrendPoint {
  string date = 1;
  int32 run_count = 2;
  int32 passed = 3;
  int32 failed = 4;
  int32 blocked = 5;
  int32 skipped = 6;
  float pass_rate_pct = 7;
}

message RunCompletionFunnel {
  int32 total_slots = 1;
  int32 executed = 2;
  int32 passed = 3;
  int32 failed = 4;
  int32 blocked = 5;
  int32 skipped = 6;
}
