syntax = "proto3";

package ameliso.v1;

import "ameliso/v1/types.proto";

option go_package = "github.com/tupe12334/ameliso/generated;ameliso";

// AmelisoService manages test cases, suites, and runs stored in PostgreSQL.
// All operations accept a repo_id identifying the connected GitHub repository (full_name, e.g. "owner/repo").
//
// Recommended agent workflow (minimum 3 RPCs):
//
//   Step 1 — CreateRun(commit_sha=<HEAD>, use_last_run=true)
//     Auto-scopes to cases affected since the last completed run.
//     On the first ever run (no prior run) all cases are included.
//     Response: pending (Case.body + latest_status), total_repo_cases,
//     uncovered_files (source files with no test case).
//
//   Optional Step 1b — if uncovered_files is non-empty:
//     BulkCreateCases(cases=[...], run_id=run.id)
//     Creates cases for coverage gaps AND adds them to the current run's scope.
//     Response: file_paths (for git add), pending (updated with new cases).
//
//   Step 2 — BulkRecordResults — record all results in one call.
//     Response: pending (remaining cases), pending_count, total_in_scope.
//
//   Step 3 — FinalizeRun(status=UNSPECIFIED)
//     Auto-detects ABORTED if any FAILED result, else COMPLETED.
//     Response: run (RunMeta with counts), results (all CaseResult records).
//
// Repeat from step 1 on the next commit.
//
// Additional zero-extra-RPC data available in responses:
//   GetRun        — cases field (Case list with body; no separate ListCases call needed)
//   ListRuns      — RunMeta.passed/failed/blocked/skipped/total counts per run
//   RecordResult  — pending field (remaining cases after this result)
//   GetRepoStatus — last_completed_run (RunMeta with counts)
//   UpdateRun     — add_cases to extend run scope; commit_sha/testers/environment patches
//   GetAffectedCases — cases (body + latest_status) + uncovered_files (coverage gaps)
//
// For richer context before running (stats, active runs), call GetRepoStatus first.
// For a read-only preview of affected cases, call GetAffectedCases instead of CreateRun.
service AmelisoService {
  // --- Cases ---
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  rpc GetCase(GetCaseRequest) returns (GetCaseResponse);
  rpc GetCaseHistory(GetCaseHistoryRequest) returns (GetCaseHistoryResponse);
  rpc GetCaseGitHistory(GetCaseGitHistoryRequest) returns (GetCaseGitHistoryResponse);
  rpc CreateCase(CreateCaseRequest) returns (CreateCaseResponse);
  rpc BulkCreateCases(BulkCreateCasesRequest) returns (BulkCreateCasesResponse);
  rpc UpdateCase(UpdateCaseRequest) returns (UpdateCaseResponse);
  rpc BulkUpdateCases(BulkUpdateCasesRequest) returns (BulkUpdateCasesResponse);
  rpc DeleteCase(DeleteCaseRequest) returns (DeleteCaseResponse);
  rpc BulkDeleteCases(BulkDeleteCasesRequest) returns (BulkDeleteCasesResponse);
  rpc RestoreCase(RestoreCaseRequest) returns (RestoreCaseResponse);
  rpc BulkRestoreCases(BulkRestoreCasesRequest) returns (BulkRestoreCasesResponse);

  // --- Suites ---
  rpc ListSuites(ListSuitesRequest) returns (ListSuitesResponse);
  rpc GetSuite(GetSuiteRequest) returns (GetSuiteResponse);
  rpc CreateSuite(CreateSuiteRequest) returns (CreateSuiteResponse);
  rpc UpdateSuite(UpdateSuiteRequest) returns (UpdateSuiteResponse);
  rpc DeleteSuite(DeleteSuiteRequest) returns (DeleteSuiteResponse);
  rpc RestoreSuite(RestoreSuiteRequest) returns (RestoreSuiteResponse);

  // --- Runs ---
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc RecordResult(RecordResultRequest) returns (RecordResultResponse);
  rpc BulkRecordResults(BulkRecordResultsRequest) returns (BulkRecordResultsResponse);
  rpc FinalizeRun(FinalizeRunRequest) returns (FinalizeRunResponse);
  rpc DeleteRun(DeleteRunRequest) returns (DeleteRunResponse);
  rpc RestoreRun(RestoreRunRequest) returns (RestoreRunResponse);
  rpc GetPendingCases(GetPendingCasesRequest) returns (GetPendingCasesResponse);
  // Rename a run's slug (date prefix is preserved). Returns the updated run metadata.
  rpc UpdateRun(UpdateRunRequest) returns (UpdateRunResponse);
  // Atomically claim a run for the authenticated user. Only succeeds when the run is
  // unclaimed or already claimed by the same user. Returns the updated run metadata.
  rpc ClaimRun(ClaimRunRequest) returns (ClaimRunResponse);
  // Delegate specific (or all pending) cases of an existing run to a worktree.io AI agent.
  // Requires WORKTREE_IO_WEBHOOK_URL to be set on the server.
  rpc DelegateCases(DelegateCasesRequest) returns (DelegateCasesResponse);

  // --- Reports ---
  // Coverage for all cases; sorted failed/never first then by priority. Optional status_filter.
  rpc GetCoverageReport(GetCoverageReportRequest) returns (GetCoverageReportResponse);
  // Pass-rate trend over a date range, per-day breakdown, and flaky case list.
  rpc GetRunTrendMetrics(GetRunTrendMetricsRequest) returns (GetRunTrendMetricsResponse);
  // Top flaky cases by flip count, with configurable lookback and suite filter.
  rpc GetFlakyCases(GetFlakyCasesRequest) returns (GetFlakyCasesResponse);
  // Return cases affected by source changes since since_ref (uses GitHub compare API).
  // Sorted failed/never first then by priority — same ordering as GetPendingCases.
  rpc GetAffectedCases(GetAffectedCasesRequest) returns (GetAffectedCasesResponse);
  // Aggregate snapshot: case counts by priority, coverage counts, suite/run totals, active runs with pending counts.
  rpc GetRepoStatus(GetRepoStatusRequest) returns (GetRepoStatusResponse);
  // Structured diff between two runs: regressions, fixes, new/removed cases, unchanged count.
  rpc CompareRuns(CompareRunsRequest) returns (CompareRunsResponse);

  // --- Testers ---
  // Returns suggested tester names from run history and GitHub contributors.
  rpc GetTesterSuggestions(GetTesterSuggestionsRequest) returns (GetTesterSuggestionsResponse);

  // --- GitHub App ---
  rpc GetGitHubInstallUrl(GetGitHubInstallUrlRequest) returns (GetGitHubInstallUrlResponse);
  rpc HandleGitHubCallback(HandleGitHubCallbackRequest) returns (HandleGitHubCallbackResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc SyncRepository(SyncRepositoryRequest) returns (SyncRepositoryResponse);
  rpc RemoveRepository(RemoveRepositoryRequest) returns (RemoveRepositoryResponse);
  // Generate a new API key for the given repository (rotates any existing key).
  rpc RotateRepoApiKey(RotateRepoApiKeyRequest) returns (RotateRepoApiKeyResponse);
  rpc ListRepoTokens(ListRepoTokensRequest) returns (ListRepoTokensResponse);
  rpc CreateRepoToken(CreateRepoTokenRequest) returns (CreateRepoTokenResponse);
  rpc DeleteRepoToken(DeleteRepoTokenRequest) returns (DeleteRepoTokenResponse);
  rpc UpdateRepoToken(UpdateRepoTokenRequest) returns (UpdateRepoTokenResponse);

  // --- User-scoped personal access tokens (PATs) ---
  // Mint, list, and revoke user-bound API tokens for CLI / MCP authentication.
  // Authn: requires an Auth0 JWT — operates on the JWT-resolved user.
  rpc CreateUserToken(CreateUserTokenRequest) returns (CreateUserTokenResponse);
  rpc ListUserTokens(ListUserTokensRequest) returns (ListUserTokensResponse);
  rpc RevokeUserToken(RevokeUserTokenRequest) returns (RevokeUserTokenResponse);
  // Atomically revoke an existing personal access token and mint a fresh
  // one with the same name + expiry. Returns the new token + its plaintext
  // secret (shown ONCE).
  rpc RotateUserToken(RotateUserTokenRequest) returns (RotateUserTokenResponse);
  // Append-only log of destructive actions (delete case/run/suite).
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse);

  // --- Testing Strategies ---
  rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesResponse);
  rpc GetStrategy(GetStrategyRequest) returns (GetStrategyResponse);
  rpc CreateStrategy(CreateStrategyRequest) returns (CreateStrategyResponse);
  rpc UpdateStrategy(UpdateStrategyRequest) returns (UpdateStrategyResponse);
  rpc DeleteStrategy(DeleteStrategyRequest) returns (DeleteStrategyResponse);
  rpc RestoreStrategy(RestoreStrategyRequest) returns (RestoreStrategyResponse);

  // --- Run Templates ---
  rpc ListRunTemplates(ListRunTemplatesRequest) returns (ListRunTemplatesResponse);
  rpc GetRunTemplate(GetRunTemplateRequest) returns (GetRunTemplateResponse);
  rpc CreateRunTemplate(CreateRunTemplateRequest) returns (CreateRunTemplateResponse);
  rpc UpdateRunTemplate(UpdateRunTemplateRequest) returns (UpdateRunTemplateResponse);
  rpc DeleteRunTemplate(DeleteRunTemplateRequest) returns (DeleteRunTemplateResponse);
  rpc RestoreRunTemplate(RestoreRunTemplateRequest) returns (RestoreRunTemplateResponse);

  // --- Outbound Webhooks ---
  rpc ListOutboundWebhooks(ListOutboundWebhooksRequest) returns (ListOutboundWebhooksResponse);
  rpc CreateOutboundWebhook(CreateOutboundWebhookRequest) returns (CreateOutboundWebhookResponse);
  rpc UpdateOutboundWebhook(UpdateOutboundWebhookRequest) returns (UpdateOutboundWebhookResponse);
  rpc DeleteOutboundWebhook(DeleteOutboundWebhookRequest) returns (DeleteOutboundWebhookResponse);
  rpc ListOutboundWebhookDeliveries(ListOutboundWebhookDeliveriesRequest) returns (ListOutboundWebhookDeliveriesResponse);
  rpc RetryWebhookDelivery(RetryWebhookDeliveryRequest) returns (RetryWebhookDeliveryResponse);

  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  rpc AddPermission(AddPermissionRequest) returns (AddPermissionResponse);
  rpc RemovePermission(RemovePermissionRequest) returns (RemovePermissionResponse);

  // --- Account ---
  // Returns the user resolved from the Bearer credential (Auth0 JWT or PAT).
  // Lets the web UI render the signed-in user's info and pre-fill audit-log
  // "my actions" filters without exposing the raw token.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // Amend notes on a finalized (completed or aborted) run result inline.
  rpc UpdateResultNotes(UpdateResultNotesRequest) returns (UpdateResultNotesResponse);

  // --- Adapter Config ---
  rpc GetAdapterConfig(GetAdapterConfigRequest) returns (GetAdapterConfigResponse);
  rpc SetAdapterConfig(SetAdapterConfigRequest) returns (SetAdapterConfigResponse);
}

// --- Cases ---

message ListCasesRequest {
  string repo_id = 1;
  repeated string tags = 2;
  Priority priority = 3;
  string query = 4;
  string suite = 5;
  // 0 = return all (default, backward-compatible)
  int32 page_size = 6;
  string page_token = 7;
  // When true, return only cases flagged as AI-runnable.
  bool ai_runnable_only = 8;
  // Optional lifecycle-status filter: "draft" or "published". Empty returns all.
  string status = 9;
  // Optional sync-status filter. UNSPECIFIED returns all.
  SyncStatus sync_status_filter = 10;
}

message ListCasesResponse {
  repeated Case cases = 1;
  // Empty when no more pages.
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetCaseRequest {
  string repo_id = 1;
  string case_path = 2;
}

message GetCaseResponse {
  Case case = 1;
  string body = 2;
}

message CaseHistoryEntry {
  string run_id = 1;
  string date = 2;
  repeated string testers = 3;
  string environment = 4;
  string commit_sha = 5;
  string status = 6;
  string notes = 7;
  int64 duration_ms = 8;
  // Name of the tester who recorded this result. Empty when not recorded by a named user.
  string recorded_by = 9;
}

message GetCaseHistoryRequest {
  string repo_id = 1;
  string case_path = 2;
  // 0 = return all
  int32 page_size = 3;
  string page_token = 4;
}

message GetCaseHistoryResponse {
  repeated CaseHistoryEntry entries = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetCaseGitHistoryRequest {
  string repo_id = 1;
  string case_path = 2;
  // 0 = use default (20)
  int32 limit = 3;
}

message GetCaseGitHistoryResponse {
  repeated CaseGitCommit commits = 1;
}

message CreateCaseRequest {
  string repo_id = 1;
  string case_path = 2;
  string title = 3;
  string description = 4;
  repeated string tags = 5;
  Priority priority = 6;
  string body = 7;
  repeated string strategy_ids = 8;
  bool ai_runnable = 9;
  // Lifecycle status: "draft" or "published". Defaults to "published" when empty.
  string status = 10;
}

message CreateCaseResponse {
  Case case = 1;
  string file_path = 2;
}

message BulkCaseEntry {
  string case_path = 1;
  string title = 2;
  string description = 3;
  repeated string tags = 4;
  Priority priority = 5;
  string body = 6;
}

message BulkCreateCasesRequest {
  string repo_id = 1;
  repeated BulkCaseEntry cases = 2;
  // Optional run_id — when set, created cases are added to this run's inline scope.
  // Useful for adding newly-discovered cases (from uncovered_files) to an in-progress run
  // without a separate UpdateRun(add_cases=...) call.
  string run_id = 3;
  // Optional idempotency key. When non-empty, the server records this key and returns
  // an empty success response on any subsequent call with the same (repo_id, key) pair
  // within 24 hours. Prevents duplicate case creation on retried requests.
  string idempotency_key = 10;
}

message BulkCreateCasesResponse {
  repeated Case cases = 1;
  // File paths for the created cases (e.g. ".ameliso/cases/auth/login.md").
  // Agents can pass these directly to git add without constructing paths manually.
  repeated string file_paths = 2;
  // Updated pending entries for the run, when run_id was set in the request.
  // Avoids a separate GetPendingCases call after adding the new cases to the run.
  repeated PendingEntry pending = 3;
  // Case paths that were skipped because a case with that path already exists.
  repeated string skipped_paths = 4;
}

message UpdateCaseRequest {
  string repo_id = 1;
  string case_path = 2;
  string title = 3;
  string description = 4;
  repeated string tags = 5;
  Priority priority = 6;
  string body = 7;
  // When non-empty, rename the case to this path. Must be unique within the repo.
  // Also updates any suites that reference the old path.
  string new_path = 8;
  // When non-empty, set the case's linked strategy IDs to exactly this list.
  // If empty (proto3 default), strategies are left unchanged.
  repeated string strategy_ids = 9;
  // Optional override for ai_runnable. Uses existing value if not set.
  optional bool ai_runnable = 10;
  // When `set_prerequisites` is true, replace the case's prerequisite list
  // with `prerequisites`. When false (proto3 default), the existing list is
  // left untouched. An empty `prerequisites` with set_prerequisites=true
  // clears all prerequisites.
  repeated string prerequisites = 11;
  bool set_prerequisites = 12;
  // Optional status override ("draft" or "published"). Empty string (proto3
  // default) leaves the existing status unchanged.
  string status = 13;
}

message UpdateCaseResponse {
  Case case = 1;
}

message BulkUpdateEntry {
  string case_path = 1;
  string title = 2;
  string description = 3;
  repeated string tags = 4;
  Priority priority = 5;
  string body = 6;
  optional bool ai_runnable = 7;
}

message BulkUpdateCasesRequest {
  string repo_id = 1;
  repeated BulkUpdateEntry cases = 2;
}

message BulkUpdateCasesResponse {
  repeated Case cases = 1;
}

message DeleteCaseRequest {
  string repo_id = 1;
  string case_path = 2;
}

message DeleteCaseResponse {
  string file_path = 1;
}

message BulkDeleteCasesRequest {
  string repo_id = 1;
  repeated string case_paths = 2;
}

message BulkDeleteCasesResponse {
  repeated string file_paths = 1;
}

message RestoreCaseRequest {
  string repo_id = 1;
  string case_path = 2;
}

message RestoreCaseResponse {}

message BulkRestoreCasesRequest {
  string repo_id = 1;
  repeated string case_paths = 2;
}

message BulkRestoreCasesResponse {}

// --- Suites ---

message ListSuitesRequest {
  string repo_id = 1;
  // 0 = return all (default, backward-compatible)
  int32 page_size = 2;
  string page_token = 3;
  // Optional free-text search against slug and name.
  string query = 4;
  // Optional sync-status filter. UNSPECIFIED returns all.
  SyncStatus sync_status_filter = 5;
}

message ListSuitesResponse {
  repeated Suite suites = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetSuiteRequest {
  string repo_id = 1;
  string slug = 2;
}

message GetSuiteResponse {
  Suite suite = 1;
}

message CreateSuiteRequest {
  string repo_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  repeated string cases = 5;
}

message CreateSuiteResponse {
  Suite suite = 1;
  string file_path = 2;
}

message UpdateSuiteRequest {
  string repo_id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  repeated string cases = 5;
  // When true, replace the case list with `cases` (even if empty). When false (default), `cases` is ignored.
  bool replace_cases = 6;
  // When non-empty, rename the suite to this slug. Must be unique within the repo.
  string new_slug = 7;
  // When non-empty, set the suite's default testing strategy.
  string default_strategy_id = 8;
}

message UpdateSuiteResponse {
  Suite suite = 1;
}

message DeleteSuiteRequest {
  string repo_id = 1;
  string slug = 2;
}

message DeleteSuiteResponse {
  string file_path = 1;
}

message RestoreSuiteRequest {
  string repo_id = 1;
  string slug = 2;
}

message RestoreSuiteResponse {}

// --- Runs ---

message ListRunsRequest {
  string repo_id = 1;
  RunStatus status = 2;
  // 0 = return all (default, backward-compatible)
  int32 page_size = 3;
  string page_token = 4;
  // Optional free-text search against run_id, suite, and environment.
  string query = 5;
  // When non-empty, only return runs claimed by this user UUID.
  string assignee_id = 6;
  // Optional sync-status filter. UNSPECIFIED returns all.
  SyncStatus sync_status_filter = 7;
  // When non-empty, only return runs with this environment tag (case-insensitive exact match).
  string environment_filter = 8;
}

message ListRunsResponse {
  repeated RunMeta runs = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetRunRequest {
  string repo_id = 1;
  string run_id = 2;
  // 0 = return all (default, backward-compatible)
  int32 page_size = 3;
  string page_token = 4;
}

message GetRunResponse {
  Run run = 1;
  // In-scope cases for this run — same set as GetPendingCases returns for a pending run.
  // Populated so callers can avoid a separate ListCases call.
  repeated Case cases = 2;
  string next_page_token = 3;
}

message CreateRunRequest {
  string repo_id = 1;
  // Human-readable slug appended to the date prefix to form run_id (e.g. "smoke").
  // When empty, the server auto-generates a unique slug from the current timestamp.
  string slug = 2;
  repeated string testers = 3;
  string environment = 4;
  string suite = 5;
  // Optional inline case list — when set, the run is scoped to these cases without
  // requiring a pre-existing suite. Mutually exclusive with `suite`, `since_ref`, and `changed_files`.
  repeated string cases = 6;
  // Optional git commit SHA (HEAD at run creation time). Stored in RunMeta so agents
  // can later pass it as `since_ref` in GetAffectedCases or CreateRun on the next iteration.
  string commit_sha = 7;
  // Auto-scope this run to cases affected since this git ref (uses GitHub compare API).
  // Mutually exclusive with `suite`, `cases`, and `use_last_run`. When `changed_files` is also
  // set, `changed_files` takes priority and no GitHub call is made.
  string since_ref = 8;
  // Pass `git diff --name-only <ref>` output to scope the run without a GitHub call.
  // Mutually exclusive with `suite`, `cases`, and `use_last_run`.
  repeated string changed_files = 9;
  // When true, auto-scope to cases affected since the last completed run's commit_sha.
  // Equivalent to since_ref=<last_completed_run.commit_sha>. If no completed run exists
  // or it has no commit_sha, all cases are included.
  // Mutually exclusive with `suite`, `cases`, `since_ref`, and `changed_files`.
  bool use_last_run = 10;
  // Optional free-text description for retrospective context (e.g. "Pre-release smoke test for v2.3").
  string description = 11;
  // Optional testing strategy ID to associate with this run.
  string strategy_id = 12;
  // GitHub pull request number to associate with this run. 0 when not set.
  int32 pr_number = 13;
  // When true, server delegates execution to worktree.io instead of waiting for a human tester.
  // Requires WORKTREE_IO_WEBHOOK_URL to be set on the server.
  bool ai_delegate = 14;
}

message CreateRunResponse {
  RunMeta run = 1;
  string dir_path = 2;
  // Pending cases at run creation time — same as GetPendingCases.pending.
  // Lets agents start executing immediately without a separate GetPendingCases call.
  repeated PendingEntry pending = 3;
  // Total cases in the repo (not just this run's scope). Lets agents compute
  // what fraction of the suite is being covered without a separate GetRepoStatus call.
  int32 total_repo_cases = 4;
  // Source files touched by the diff (since_ref / use_last_run / changed_files) that have
  // no matching test case — i.e., coverage gaps. Agents can use this list to decide which
  // new cases to create without a separate GetAffectedCases call.
  // Empty when the run is not scoped by a diff (suite, inline cases, or all cases).
  repeated string uncovered_files = 5;
  // True if the AI agent was successfully notified to begin execution.
  bool delegated = 6;
  // Non-empty when delegation was attempted but failed (informational; run still created).
  string delegation_error = 7;
}

message RecordResultRequest {
  string repo_id = 1;
  string run_id = 2;
  string case_path = 3;
  ResultStatus status = 4;
  string notes = 5;
  // Execution time in milliseconds. 0 means not recorded.
  int64 duration_ms = 6;
  // Free-form failure category (e.g. "assertion", "timeout", "crash"). Empty when not set.
  string error_type = 7;
  // ID of the testing strategy used to execute this case. Empty when not set.
  string strategy_id = 8;
  // When true, skip prerequisite blocking check. Allows recording a result even
  // if prerequisite cases have not yet passed in the current run.
  bool skip_prerequisite_check = 9;
  // Name of the tester recording this result. Empty means anonymous.
  string recorded_by = 10;
}

message RecordResultResponse {
  CaseResult result = 1;
  int32 pending_count = 2;
  int32 total_in_scope = 3;
  // Remaining pending cases after this result — lets agents skip a separate
  // GetPendingCases call when testing sequentially.
  repeated PendingEntry pending = 4;
}

message BulkResultEntry {
  string case_path = 1;
  ResultStatus status = 2;
  string notes = 3;
  // Execution time in milliseconds. 0 means not recorded.
  int64 duration_ms = 4;
  // Free-form failure category (e.g. "assertion", "timeout", "crash"). Empty when not set.
  string error_type = 5;
  // ID of the testing strategy used to execute this case. Empty when not set.
  string strategy_id = 6;
  // When true, skip prerequisite blocking check for this specific entry.
  bool skip_prerequisite_check = 7;
}

message BulkRecordResultsRequest {
  string repo_id = 1;
  string run_id = 2;
  repeated BulkResultEntry results = 3;
  // Optional idempotency key. When non-empty, the server records this key and returns
  // an empty success response on any subsequent call with the same (repo_id, key) pair
  // within 24 hours. Prevents duplicate result recording on retried requests.
  string idempotency_key = 4;
  // Name of the tester recording these results. Applied to all entries.
  string recorded_by = 5;
}

message BulkRecordResultsResponse {
  repeated CaseResult results = 1;
  int32 pending_count = 2;
  int32 total_in_scope = 3;
  // Remaining pending cases after bulk recording — lets agents confirm completion
  // or find remaining cases without a separate GetPendingCases call.
  repeated PendingEntry pending = 4;
}

message FinalizeRunRequest {
  string repo_id = 1;
  string run_id = 2;
  // Desired final status. When UNSPECIFIED (or omitted), the server auto-detects:
  // ABORTED if any recorded result is FAILED, otherwise COMPLETED.
  RunStatus status = 3;
}

message FinalizeRunResponse {
  RunMeta run = 1;
  // All results for the finalized run — avoids a separate GetRun call when agents
  // need to inspect which cases failed or were blocked.
  repeated CaseResult results = 2;
  // Non-empty when the run was auto-aborted; contains the path of the first failing case.
  string abort_reason = 3;
}

message DeleteRunRequest {
  string repo_id = 1;
  string run_id = 2;
}

message DeleteRunResponse {
  string dir_path = 1;
}

message RestoreRunRequest {
  string repo_id = 1;
  string run_id = 2;
}

message RestoreRunResponse {}

message GetPendingCasesRequest {
  string repo_id = 1;
  string run_id = 2;
  // When set (non-UNSPECIFIED), only return pending cases at this priority level.
  // Useful for agents that want to tackle high-priority cases first.
  Priority priority_filter = 3;
  // 0 = return all (default, backward-compatible)
  int32 page_size = 4;
  string page_token = 5;
}

// A pending test case with status — for agent-friendly GetPendingCases and CreateRun.
message PendingEntry {
  Case case = 1;
  reserved 2;
  reserved "body";
  ResultStatus latest_status = 3;
  // True when at least one of this case's prerequisites has a latest_status
  // of FAILED or BLOCKED in the same run scope. Agents should skip or defer
  // such cases until the prerequisites are passing.
  bool blocked_by_prerequisite = 4;

  // ISO date of the most recent run that included this case (empty if never run).
  string last_run_date = 5;
}

message GetPendingCasesResponse {
  reserved 1, 3;
  reserved "cases", "entries";
  int32 total_in_scope = 2;
  // Preferred: full pending case data — case metadata (with body) + latest_status.
  // Sorted failed/never first then by case priority.
  repeated PendingEntry pending = 4;
  string next_page_token = 5;
}

message UpdateRunRequest {
  string repo_id = 1;
  string run_id = 2;
  // New slug portion only; date prefix (YYYY-MM-DD) is preserved.
  // The resulting new run_id will be "{date_prefix}-{new_slug}".
  string new_slug = 3;
  // Optional metadata updates — only applied when the field is non-empty.
  // Use these to patch commit_sha, testers, or environment after creation.
  optional string commit_sha = 4;
  repeated string testers = 5;
  optional string environment = 6;
  // Extend the run's inline case scope with these additional case paths.
  // Only valid for inline-scoped runs (created with use_last_run, since_ref, changed_files, or cases).
  // Idempotent — already-included case paths are ignored.
  // Use this after BulkCreateCases to add newly-created cases to an in-progress run.
  repeated string add_cases = 7;
  // Optional free-text description update. When set, replaces the existing description.
  optional string description = 8;
  // Remove case paths from the run's inline case scope.
  // Only valid for inline-scoped runs.
  // Idempotent — case paths not currently in scope are ignored.
  repeated string remove_cases = 9;
}

message UpdateRunResponse {
  RunMeta run = 1;
  string new_dir_path = 2;
  // Updated pending cases after any add_cases — avoids a separate GetPendingCases call.
  // Populated only when add_cases is non-empty.
  repeated PendingEntry pending = 3;
}

message ClaimRunRequest {
  string repo_id = 1;
  string run_id = 2;
}
message ClaimRunResponse {
  RunMeta run = 1;
}

// --- Reports ---

message GetCoverageReportRequest {
  string repo_id = 1;
  ResultStatus status_filter = 2;
  // When non-empty, filter entries to those whose case_path or title contains this string (case-insensitive).
  string search = 3;
  // When set (non-UNSPECIFIED), only return entries whose case priority matches.
  Priority priority_filter = 4;
  // When true, only return entries with a flakiness_score > 0.
  bool flaky_only = 5;
}

message GetCoverageReportResponse {
  repeated CoverageEntry entries = 1;
  int32 run_count = 2;
}

message GetRunTrendMetricsRequest {
  string repo_id = 1;
  string start_date = 2;
  string end_date = 3;
  string suite_filter = 4;
}

message GetRunTrendMetricsResponse {
  repeated RunTrendPoint points = 1;
  RunCompletionFunnel funnel = 2;
  repeated FlakyCaseSummary flaky_cases = 3;
  repeated TrendCaseSummary improved_cases = 4;   // cases with pass streak after recent failure
  repeated TrendCaseSummary regressed_cases = 5;  // cases with fail streak after recent pass
}

message GetAffectedCasesRequest {
  string repo_id = 1;
  string since_ref = 2;
  // If set, skip GitHub comparison and match cases against these file paths directly.
  // Pass output of `git diff --name-only <ref>` for local workflows without GitHub.
  repeated string changed_files = 3;
  // When set (non-UNSPECIFIED), only return affected cases at this priority level.
  Priority priority_filter = 4;
  // When non-empty, only return affected cases that have ALL of these tags.
  repeated string tags = 5;
}

message GetAffectedCasesResponse {
  repeated AffectedCase cases = 1;
  string reason = 2;
  // Changed files that have no matching test case — i.e., coverage gaps.
  // Agents can use this list to decide which new cases to create.
  // Doc files (.md, .yml, etc.) are excluded.
  repeated string uncovered_files = 3;
}

// --- Repo Status ---

message GetRepoStatusRequest {
  string repo_id = 1;
}

message ActiveRunStatus {
  string run_id = 1;
  repeated string testers = 2;
  string suite = 3;
  string date = 4;
  int32 pending_cases = 5;
  int32 total_in_scope = 6;
  string commit_sha = 7;
  string environment = 8;
  // Server-formatted relative timestamp (e.g. "2h ago", "3 days ago", "Apr 25, 2026").
  string formatted_date = 9;
}

message GetRepoStatusResponse {
  int32 total_cases = 1;
  int32 high_cases = 2;
  int32 medium_cases = 3;
  int32 low_cases = 4;
  int32 passed = 5;
  int32 failed = 6;
  int32 blocked = 7;
  int32 skipped = 8;
  int32 never_run = 9;
  int32 suite_count = 10;
  int32 run_count = 11;
  repeated ActiveRunStatus active_runs = 12;
  // Most recently completed run — commit_sha can be passed as since_ref to GetAffectedCases
  // without a separate ListRuns call.
  RunMeta last_completed_run = 13;
  int32 strategy_count = 14;
  // Last 10 distinct non-empty environment values, most recent first.
  repeated string recent_environments = 15;
  // Number of consecutive GitHub sync failures for this repo since last success.
  uint32 sync_failure_count = 16;
  // Error message from the most recent failed GitHub sync, empty if none.
  string last_sync_error = 17;
  // Per-suite coverage breakdown, sorted by slug.
  repeated SuiteCoverageSummary suite_coverage = 18;
  // Cases with ≥1 pass/fail flip across their recorded runs, sorted by flip_count desc.
  repeated FlakyCaseSummary flaky_cases = 19;
  // True when WORKTREE_IO_WEBHOOK_URL is configured — AI delegation is available.
  bool ai_delegation_available = 20;
}

message CompareRunsRequest {
  string repo_id = 1;
  string run_id_a = 2;
  string run_id_b = 3;
}

message RunCaseDiff {
  string case_path = 1;
  string old_status = 2;
  string new_status = 3;
}

message CompareRunsResponse {
  // Cases that worsened (pass/skipped → fail/blocked).
  repeated RunCaseDiff regressions = 1;
  // Cases that improved (fail/blocked → pass).
  repeated RunCaseDiff fixes = 2;
  // Cases present in run_id_b but not run_id_a.
  repeated string new_cases = 3;
  // Cases present in run_id_a but not run_id_b.
  repeated string removed_cases = 4;
  // Cases whose status did not change between the two runs.
  int32 unchanged_count = 5;
}

