message DeleteRepoTokenResponse {}
message UpdateRepoTokenRequest { string repo_id = 1; string token = 2; string role = 3; }
message UpdateRepoTokenResponse { RepoToken token = 1; }

message UserToken {
  string id = 1;                       // UUID of the row
  string name = 2;                     // human label provided at mint time
  string token_prefix = 3;             // first 12 chars of the secret (display only)
  string created_at = 4;                // ISO-8601
  string last_used_at = 5;              // ISO-8601 or empty
  string expires_at = 6;                // ISO-8601 or empty for "never"
}
message CreateUserTokenRequest {
  string name = 1;
  optional int32 expires_in_days = 2;   // 0 / absent = never
}
message CreateUserTokenResponse {
  UserToken token = 1;
  // The full bearer string. Returned ONCE at creation; never queryable later.
  string secret = 2;
}
message ListUserTokensRequest {}
message ListUserTokensResponse { repeated UserToken tokens = 1; }
message RevokeUserTokenRequest { string id = 1; }
message RevokeUserTokenResponse {}
message RotateUserTokenRequest {
  // ID of the token to rotate. The new token reuses the same name +
  // expiry; only the plaintext secret changes.
  string id = 1;
}
message RotateUserTokenResponse {
  UserToken token = 1;
  // The full bearer string for the new token. Returned ONCE.
  string secret = 2;
}

message ListAuditLogRequest {
